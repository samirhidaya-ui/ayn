<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--g1:#06201C;--g2:#0B3A31;--g3:#145247;--gold:#E0B550;--gl:#F3DFA8;--gd:#A87A24;--cream:#FBF4E2;--cream2:#EEE0BC;--ink:#1c2b27;--mut:#7d6f4c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--g1);overscroll-behavior:none}
body{font-family:'Cairo',-apple-system,'Segoe UI',Tahoma,sans-serif;color:#fff;direction:rtl;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text;font-family:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 0%,var(--g3) 0%,var(--g2) 40%,var(--g1) 100%)}
.scr{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 10px) 14px 96px}
.lat{font-family:'Montserrat',Inter,sans-serif;direction:ltr;unicode-bidi:isolate}
.gold{background:linear-gradient(180deg,#F8E7B0,#E0B550 55%,#B3852B);color:#1a2b24}
.gtxt{background:linear-gradient(#FFF0B8,#E0B550 60%,#A87A24);-webkit-background-clip:text;color:transparent}
.card{background:linear-gradient(#FFFDF4,var(--cream));color:var(--ink);border:1.5px solid #E9D9A8;border-radius:20px;box-shadow:0 6px 16px rgba(0,0,0,.28),inset 0 1px 0 #fff}
.dk{background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1.5px solid rgba(224,181,80,.45);border-radius:20px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.top .t{text-align:center}.top h1{font-size:25px;font-weight:800;line-height:1.1}.top small{font-size:11px;color:#d8e4df;display:block}
.ib{width:42px;height:42px;border-radius:14px;border:1.5px solid rgba(224,181,80,.5);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--gl);background:rgba(255,255,255,.06);position:relative}
.badge{position:absolute;top:-4px;left:-4px;background:#d33;color:#fff;font:700 10px Cairo;border-radius:9px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.hero{border-radius:22px;overflow:hidden;position:relative;height:110px;border:1.5px solid rgba(224,181,80,.5)}
.hero{background:linear-gradient(270deg,#0B3A31,#06201C)}.hero img{position:absolute;left:0;top:0;height:100%;width:58%;object-fit:cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(270deg,#0B3A31 38%,rgba(11,58,49,0) 75%)}
.hero div{position:absolute;right:16px;top:50%;transform:translateY(-50%);z-index:2;font-size:15px;font-weight:800;line-height:1.55;width:55%}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}
.tile{height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:800;font-size:13px;text-align:center;line-height:1.2;padding:4px}
.tile img{height:46px;filter:drop-shadow(0 4px 3px rgba(120,80,0,.35))}
.tile:active,.ent:active,.btn:active,.row:active{transform:scale(.97)}
.sec{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:15px;margin:12px 2px 7px;color:var(--gl)}
.entries{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ent{padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:12px}
.ent .ic{height:52px;display:flex;align-items:center;justify-content:center}.ent img{height:50px;filter:drop-shadow(0 5px 4px rgba(0,0,0,.35))}
.kpi{display:flex;justify-content:space-around;padding:10px 4px;text-align:center}.kpi b{display:block;font:800 24px Cairo;color:#0E4A3B}.kpi span{font-size:11px;font-weight:700;color:var(--mut)}
.ai{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-top:12px;background:linear-gradient(135deg,#0F4A3D,#08261F);border:1.5px solid var(--gold);border-radius:18px;box-shadow:0 0 18px rgba(224,181,80,.25)}
.ai img{height:46px;border-radius:10px}.ai b{display:block;font-size:15px;color:var(--gl)}.ai small{font-size:11px;color:#cfe0da}
.nav{position:fixed;bottom:0;left:0;right:0;height:calc(70px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;justify-content:space-around;align-items:center;background:linear-gradient(#0C3A31,#06201C);border-top:1.5px solid rgba(224,181,80,.5);z-index:20}
.nav a{flex:1;text-align:center;font-size:11px;font-weight:700;color:#b8c9c3;display:flex;flex-direction:column;align-items:center;gap:1px}.nav a i{font-style:normal;font-size:22px}
.nav a.on{color:var(--gl)}.nav .plus{flex:0 0 62px;margin-top:-28px}.nav .plus div{width:58px;height:58px;border-radius:50%;font:800 34px Montserrat;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 5px rgba(224,181,80,.25),0 8px 16px rgba(0,0,0,.5)}
.btn{border:0;border-radius:16px;padding:13px 16px;font:800 15px Cairo;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.o{background:transparent;border:1.5px solid var(--gold);color:var(--gl)}.btn.r{background:linear-gradient(#e86a5a,#b3281b);color:#fff}.btn.sm{padding:8px 12px;font-size:13px;width:auto;border-radius:12px}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:9px}
.row .av{width:46px;height:46px;border-radius:14px;background:linear-gradient(#0F4A3D,#08261F);display:flex;align-items:center;justify-content:center;flex:none}.row .av img{height:34px}
.row .m{flex:1;min-width:0}.row .m b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .m small{color:var(--mut);font-size:12px;font-weight:600}
.mini{display:flex;gap:6px}.mb{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 8px rgba(0,0,0,.35),inset 0 -3px 5px rgba(0,0,0,.2),inset 0 2px 3px rgba(255,255,255,.5)}
.wa{background:radial-gradient(circle at 35% 30%,#6de597,#12853a)}.ca{background:radial-gradient(circle at 35% 30%,#5fc7b5,#14685a)}.mp{background:radial-gradient(circle at 35% 30%,#ff8a74,#b52a1b)}.mb.off{filter:grayscale(1);opacity:.35}
.mb svg{width:20px;height:20px}
.bigb{display:flex;justify-content:space-around;margin:10px 0 6px}.bigb a{text-align:center;font-size:12px;font-weight:800;color:#fff}.bigb .mb{width:64px;height:64px;margin:0 auto 4px}.bigb svg{width:34px;height:34px}
label{display:block;font-size:12px;font-weight:700;color:var(--gl);margin:10px 2px 4px}
.in{width:100%;border:1.5px solid #E1D0A0;border-radius:14px;padding:12px;font-size:16px;background:#fff;color:var(--ink);outline:0;direction:rtl}textarea.in{min-height:84px;resize:none}
.f{display:flex;gap:8px;align-items:center}.f .in{flex:1}.mic{flex:none;width:46px;height:46px;border-radius:14px;border:0;font-size:20px}.mic.live{background:#d33;color:#fff;animation:pl 1s infinite}@keyframes pl{50%{opacity:.5}}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.08);padding:5px;border-radius:16px;margin:8px 0}.tabs a{flex:1;text-align:center;padding:9px 2px;border-radius:12px;font-weight:800;font-size:13px;color:#cfe0da}.tabs a.on{background:linear-gradient(#F8E7B0,#E0B550);color:#1a2b24}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end}.sheet>div{width:100%;max-height:92%;overflow-y:auto;background:linear-gradient(#0E4034,#07251F);border-radius:26px 26px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));border-top:2px solid var(--gold)}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}.hd h2{flex:1;font-size:20px;font-weight:800}.back{font-size:26px;color:var(--gl);width:36px}
.chip{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:800;background:#E9D9A8;color:#6b4e12}.chip.g{background:#cfeedd;color:#0b6a38}.chip.w{background:#ffe3a3;color:#7a4b00}
.tl{padding:11px 12px;margin-bottom:9px}.tl .h{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);font-weight:700}.tl p{font-size:14px;margin:4px 0;font-weight:600;line-height:1.5;white-space:pre-wrap}.tl img.ph{width:100%;border-radius:12px;margin-top:6px;max-height:240px;object-fit:cover}.tl audio{width:100%;margin-top:6px}
.sigc{width:100%;height:170px;background:#fff;border-radius:14px;border:2px dashed #C9A96A;touch-action:none}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);background:#fff;color:#142;padding:10px 16px;border-radius:14px;font-weight:800;font-size:14px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:92%;text-align:center;display:none}
.map{position:relative;width:100%;height:100%;overflow:hidden;background:#0b3a31;touch-action:none}
.map .tiles img{position:absolute;width:256px;height:256px;display:block}
.map .grid2{position:absolute;inset:0;background-image:linear-gradient(rgba(224,181,80,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(224,181,80,.12) 1px,transparent 1px);background-size:48px 48px}
.pin{position:absolute;transform:translate(-50%,-100%);text-align:center;pointer-events:auto}.pin img{height:46px;filter:drop-shadow(0 6px 4px rgba(0,0,0,.55));display:block;margin:0 auto}.pin span{display:inline-block;margin-top:-2px;background:rgba(6,32,28,.9);border:1px solid var(--gold);color:#fff;font-size:11px;font-weight:800;border-radius:9px;padding:1px 7px;white-space:nowrap}
.zoom{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:8px;z-index:5}.zoom a{width:42px;height:42px;border-radius:13px;background:rgba(6,32,28,.92);border:1.5px solid var(--gold);color:var(--gl);font:800 22px Montserrat;display:flex;align-items:center;justify-content:center}
.login{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;background:radial-gradient(120% 70% at 50% 0%,#145247,#0B3A31 45%,#06201C)}
.login .logo{height:96px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}.login h1{font:800 30px Montserrat;letter-spacing:7px;margin-top:6px}.login p{font:600 11px Montserrat;letter-spacing:5px;color:var(--gl);margin:4px 0 22px}.login .in{text-align:left;direction:ltr;margin-bottom:10px;font-size:17px}
#print{display:none}
@media print{html,body{height:auto;background:#fff}#app,#toast,.sheet,.login{display:none!important}#print{display:block;color:#111;direction:rtl;font-family:'Cairo',Tahoma,sans-serif}@page{size:A4;margin:10mm}}
.pr{background:#fff;color:#111}.pr .hdr{background:linear-gradient(135deg,#0E4A3B,#06201C);color:#F3DFA8;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-radius:0 0 0 0}
.pr table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px}.pr th{background:#F3E8C8;color:#6b4e12;padding:7px;text-align:right;font-size:11px;border-bottom:2px solid #0E4A3B}.pr td{padding:7px;border-bottom:1px solid #eadfc2;vertical-align:top}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div><div id="print"></div>
<input id="fileIn" type="file" accept="image/*" capture="environment" style="display:none">
<input id="fileIn2" type="file" accept="image/*" style="display:none">
<input id="impIn" type="file" accept=".json,application/json" style="display:none">

/* ---------- storage (IndexedDB, works offline) ---------- */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('mush',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function load(){try{const d=await idb();const v=await new Promise(res=>{const q=d.transaction('kv').objectStore('kv').get('state');q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)});if(v)return v}catch(e){}try{const j=localStorage.getItem('mush_state');return j?JSON.parse(j):null}catch(e){return null}}
let tmr;function save(){clearTimeout(tmr);tmr=setTimeout(async()=>{try{const d=await idb();d.transaction('kv','readwrite').objectStore('kv').put(S,'state')}catch(e){try{localStorage.setItem('mush_state',JSON.stringify(S))}catch(_){toast('المساحة ممتلئة — خُد نسخة احتياطية')}}},120)}
function toast(m,t=2600){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',t)}
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return 'x'+h}}

function shrink(file,max=1280,q=.72){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function pickPhoto(cam=true){return new Promise(res=>{const i=$(cam?'#fileIn':'#fileIn2');i.value='';i.onchange=async()=>{if(i.files[0]){try{res(await shrink(i.files[0]))}catch(e){toast('تعذّر قراءة الصورة');res(null)}}else res(null)};i.click()})}
function getLoc(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej('no');navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),e=>rej(e.message||'denied'),{enableHighAccuracy:true,timeout:15000,maximumAge:5000})})}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function dictate(btn,onText){if(!SR){toast('الإملاء الصوتي مش شغال في المتصفح ده — استعمل ميكروفون كيبورد الأيفون 🎙 أو التسجيل الصوتي');return}
 if(btn._r){btn._r.stop();return}
 const r=new SR();r.lang='ar-SA';r.interimResults=true;r.continuous=true;btn._r=r;btn.classList.add('live');
 r.onresult=e=>{let t='';for(const x of e.results)t+=x[0].transcript+' ';onText(t.trim())};
 r.onerror=e=>{toast(e.error==='not-allowed'?'اسمح بالميكروفون من إعدادات المتصفح':'تعذّر الإملاء ('+e.error+') — استعمل ميكروفون الكيبورد أو التسجيل الصوتي')};
 r.onend=()=>{btn.classList.remove('live');btn._r=null};try{r.start()}catch(e){}}
let rec=null;
async function recAudio(btn,onDone){if(rec){rec.stop();return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const mr=new MediaRecorder(st);const ch=[];mr.ondataavailable=e=>ch.push(e.data);
 mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());btn.classList.remove('live');btn.textContent='⏺ تسجيل صوتي';const b=new Blob(ch,{type:mr.mimeType||'audio/mp4'});const fr=new FileReader();fr.onload=()=>onDone(fr.result);fr.readAsDataURL(b);rec=null};
 mr.start();rec=mr;btn.classList.add('live');btn.textContent='⏹ إيقاف التسجيل'}catch(e){toast('اسمح بالميكروفون عشان التسجيل')}}
const ar2en=s=>String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
function parseSpeech(t){t=ar2en(t);const m=t.replace(/[\s\-]/g,'').match(/(\+?\d{9,14})/);const phone=m?m[1]:'';let name=t.split(/رقم|تليفون|جوال|موبايل|\d/)[0].replace(/^(اسم|المورد|العميل)\s*/,'').trim();return{name,phone,rest:t}}

<div class="ai" data-act="smart"><img src="${IM('f_ai')}"><div><b>المستشار الذكي للمشتريات</b><small>${al[0]?esc(al[0]):'كل شيء تمام ✓'}</small></div></div>

</div>${nav('home')}`}
function supRow(s){const last=S.recs.filter(r=>r.supId===s.id).sort((a,b)=>b.at-a.at)[0];return `<div class="card row" data-go="sup" data-id="${s.id}"><div class="av"><img src="${IM(s.type==='عميل'?'t_po':'t_supp')}"></div><div class="m"><b>${esc(s.name)}</b><small>${esc(s.type)}${s.phone?' · '+esc(s.phone):''}${s.addr?' · '+esc(s.addr):''}</small></div>${ballsHTML(s)}</div>`}
function sups(){const q=(V.q||'').trim(),ty=V.ty||'الكل';const l=S.sups.filter(s=>(ty==='الكل'||s.type===ty)&&(!q||(s.name+s.phone+s.addr).includes(q))).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
return `<div class="scr"><div class="hd"><span class="back" data-act="back">›</span><h2>الموردين والعملاء</h2><button class="btn gold sm" data-act="addSup">+ إضافة</button></div>
<input class="in" id="q" placeholder="ابحث بالاسم أو الرقم" value="${esc(q)}">
<div class="tabs">${['الكل','مورد','عميل'].map(t=>`<a data-ty="${t}" class="${ty===t?'on':''}">${t}</a>`).join('')}</div>
${l.map(supRow).join('')||`<div class="dk" style="padding:26px;text-align:center;font-weight:700;line-height:1.9">لا يوجد بعد.<br>اضغط «+ إضافة» وسجّل أول مورد بالصوت أو الصورة أو يدوي</div>`}</div>${nav('sups')}`}
function supPage(id){const s=S.sups.find(x=>x.id===id);if(!s)return back();const rs=S.recs.filter(r=>r.supId===id).sort((a,b)=>b.at-a.at);const cf=S.confs.filter(c=>c.supId===id);
return `<div class="scr"><div class="hd"><span class="back" data-act="back">›</span><h2>${esc(s.name)}</h2><button class="btn o sm" data-act="editSup" data-id="${id}">تعديل</button></div>
<div class="dk" style="padding:12px 14px;display:flex;gap:12px;align-items:center"><img src="${IM(s.type==='عميل'?'t_po':'t_supp')}" style="height:52px"><div style="flex:1"><div style="font-weight:800">${esc(s.type)} ${s.phone?`· <span class="lat">${esc(s.phone)}</span>`:''}</div><div style="font-size:13px;color:#cfe0da">${esc(s.addr||'—')}</div></div><div style="text-align:center"><div class="lat" style="font-weight:800;font-size:20px;color:var(--gl)">${nf(s.balance)}</div><div style="font-size:10px;color:#cfe0da">الرصيد ر.س</div></div></div>
${ballsHTML(s,true)}
<div class="entries" style="margin:8px 0">

<button class="btn gold" data-act="newConf" data-id="${id}">✍️ مصادقة رصيد وتوقيع ${cf.length?`(${cf.length} موقّعة)`:''}</button>
${s.notes?`<div class="dk" style="padding:10px 14px;margin-top:10px;font-size:14px;line-height:1.7;white-space:pre-wrap">${esc(s.notes)}</div>`:''}
<div class="sec"><span>السجل (${rs.length})</span></div>
${rs.map(recCard).join('')||'<div class="dk" style="padding:18px;text-align:center;font-weight:700">لا توجد سجلات بعد</div>'}</div>${nav('sups')}`}
const KIND={visit:'زيارة',note:'ملاحظة',invoice:'فاتورة',req:'طلب قطع غيار',po:'أمر شراء',waiting:'Waiting',loc:'موقع',payment:'سداد'};
function recCard(r){return `<div class="card tl"><div class="h"><span><span class="chip ${r.kind==='waiting'?'w':''}">${KIND[r.kind]||r.kind}</span> ${r.mode==='voice'?'🎙':r.mode==='photo'?'📷':r.mode==='loc'?'📍':'✍️'}</span><span>${new Date(r.at).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'})}</span></div>${r.text?`<p>${esc(r.text)}</p>`:''}${r.amount?`<p><b class="lat" style="font-size:17px;color:#0E4A3B">${nf(r.amount)}</b> ر.س</p>`:''}${r.lat!=null?`<p><a href="https://www.google.com/maps/search/?api=1&query=${r.lat},${r.lng}" target="_blank" style="color:#b52a1b;font-weight:800">📍 افتح الموقع في الخرائط</a></p>`:''}${r.img?`<img class="ph" src="${r.img}">`:''}${r.audio?`<audio controls src="${r.audio}"></audio>`:''}${r.kind==='waiting'?`<button class="btn o sm" style="margin-top:6px;color:#0E4A3B;border-color:#0E4A3B" data-act="done" data-id="${r.id}">${r.done?'✓ تمّت':'تحديد كمنتهية'}</button>`:''}<button class="btn sm" style="margin-top:6px;background:none;color:#b3281b;padding:4px 0" data-act="delRec" data-id="${r.id}">حذف</button></div>`}
/* supplier form w/ voice/photo/manual/location */
function supForm(id){const s=id?S.sups.find(x=>x.id===id):{name:'',type:'مورد',phone:'',addr:'',balance:0,notes:'',lat:null,lng:null};const d={...s};
const sh=document.createElement('div');sh.className='sheet';sh.innerHTML=`<div><div class="hd"><h2>${id?'تعديل':'إضافة'} مورد / عميل</h2><span class="back" data-x="1">✕</span></div>
<div class="dk" style="padding:10px;display:flex;gap:8px"><button class="btn gold" id="vq">🎙 قل: اسم المورد + رقمه</button><button class="btn o" id="pq" style="width:auto;padding:13px 14px">📷</button></div>
<label>الاسم</label><div class="f"><input class="in" id="n" value="${esc(d.name)}"><button class="mic gold" data-m="n">🎙</button></div>
<label>النوع</label><div class="tabs" id="ty">${['مورد','عميل'].map(t=>`<a data-v="${t}" class="${d.type===t?'on':''}">${t}</a>`).join('')}</div>
<label>رقم التليفون / واتساب</label><input class="in lat" id="p" inputmode="tel" value="${esc(d.phone)}" style="direction:ltr;text-align:left">
<label>العنوان / المنطقة</label><div class="f"><input class="in" id="a" value="${esc(d.addr)}"><button class="mic gold" data-m="a">🎙</button></div>
<label>الرصيد الحالي (ر.س) — صفر لو لا يوجد</label><input class="in lat" id="b" inputmode="decimal" value="${d.balance??0}" style="direction:ltr;text-align:left">
<label>ملاحظات</label><div class="f"><textarea class="in" id="nt">${esc(d.notes)}</textarea><button class="mic gold" data-m="nt">🎙</button></div>
<button class="btn gold" id="lq" style="margin-top:12px">📍 <span id="lt">${d.lat!=null?'الموقع محفوظ ✓ — تحديث':'احفظ موقعي الحالي'}</span></button>
<div style="display:flex;gap:8px;margin-top:14px"><button class="btn gold" id="sv">حفظ</button>${id?'<button class="btn r" id="dl" style="width:auto">حذف</button>':''}</div></div>`;document.body.appendChild(sh);
const g=i=>$('#'+i,sh);
sh.onclick=e=>{if(e.target.dataset.x||e.target===sh)sh.remove()};
$$('[data-v]',sh).forEach(a=>a.onclick=()=>{d.type=a.dataset.v;$$('[data-v]',sh).forEach(x=>x.classList.toggle('on',x===a))});
$$('[data-m]',sh).forEach(b=>b.onclick=()=>{const i=g(b.dataset.m);const base=i.value?i.value+' ':'';dictate(b,t=>i.value=base+t)});
g('vq').onclick=function(){dictate(this,t=>{const p=parseSpeech(t);if(p.name)g('n').value=p.name;if(p.phone)g('p').value=p.phone;g('nt').dataset.sp=p.rest})};
g('pq').onclick=async()=>{const im=await pickPhoto(true);if(im){d.photo=im;toast('تم إرفاق الصورة (كارت/واجهة المحل)')}};
g('lq').onclick=async()=>{g('lt').textContent='جاري تحديد الموقع…';try{const l=await getLoc();d.lat=l.lat;d.lng=l.lng;g('lt').textContent='تم حفظ الموقع ✓ (دقة '+Math.round(l.acc)+'م)'}catch(e){g('lt').textContent='تعذّر — فعّل الموقع للمتصفح';toast('فعّل خدمات الموقع للمتصفح (إعدادات الأيفون ← الخصوصية)')}};
g('sv').onclick=()=>{d.name=g('n').value.trim();if(!d.name)return toast('اكتب الاسم أولاً');d.phone=g('p').value.trim();d.addr=g('a').value.trim();d.balance=parseFloat(ar2en(g('b').value))||0;d.notes=g('nt').value.trim();
 if(id){Object.assign(s,d)}else{d.id=uid();d.created=Date.now();S.sups.push(d);S.last=d.id}
 if(d.photo&&!id)S.recs.push({id:uid(),supId:d.id,kind:'note',mode:'photo',text:'صورة عند الإضافة',img:d.photo,at:Date.now()});
 save();sh.remove();toast('تم الحفظ ✓');render()};
if(g('dl'))g('dl').onclick=()=>{if(confirm('حذف '+s.name+' وكل سجلاته؟')){S.sups=S.sups.filter(x=>x.id!==id);S.recs=S.recs.filter(r=>r.supId!==id);S.confs=S.confs.filter(c=>c.supId!==id);save();sh.remove();V={n:'sups'};H=[];render()}}}
/* entry sheet: voice / photo / manual / location */
function entry(o={}){if(!S.sups.length){toast('أضف مورد أو عميل أولاً');return supForm()}
let mode=o.mode||'manual',sid=o.sid||S.last||S.sups[0].id,kind=o.kind||(mode==='photo'?'invoice':mode==='loc'?'loc':'note');const d={text:'',img:null,audio:null,amount:''};
const sh=document.createElement('div');sh.className='sheet';document.body.appendChild(sh);
function draw(){sh.innerHTML=`<div><div class="hd"><h2>إدخال جديد</h2><span class="back" data-x="1">✕</span></div>
<label>المورد / العميل</label><select class="in" id="s">${S.sups.map(s=>`<option value="${s.id}" ${s.id===sid?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
<div class="tabs" id="md"><a data-m="voice" class="${mode==='voice'?'on':''}">🎙 صوت</a><a data-m="photo" class="${mode==='photo'?'on':''}">📷 صورة</a><a data-m="manual" class="${mode==='manual'?'on':''}">✍ يدوي</a><a data-m="loc" class="${mode==='loc'?'on':''}">📍 موقع</a></div>
<label>النوع</label><select class="in" id="k">${Object.entries(KIND).filter(([k])=>k!=='loc'||mode==='loc').map(([k,v])=>`<option value="${k}" ${k===kind?'selected':''}>${v}</option>`).join('')}</select>
${mode==='voice'?`<div style="display:flex;gap:8px;margin-top:10px"><button class="btn gold" id="dc">🎙 إملاء نصي</button><button class="btn o" id="rc">⏺ تسجيل صوتي</button></div>${d.audio?`<audio controls src="${d.audio}" style="width:100%;margin-top:8px"></audio>`:''}`:''}
${mode==='photo'?`<div style="display:flex;gap:8px;margin-top:10px"><button class="btn gold" id="cm">📷 تصوير</button><button class="btn o" id="gl">🖼 من المعرض</button></div>${d.img?`<img src="${d.img}" style="width:100%;border-radius:14px;margin-top:8px;max-height:220px;object-fit:cover">`:''}<div style="font-size:11px;color:#cfe0da;margin-top:6px">الصورة تُحفظ في الجهاز وتشتغل بدون نت — قراءة بنود الفاتورة آلياً تحتاج نت (المرحلة التالية)، دلوقتي اكتب الإجمالي.</div>`:''}
${mode==='loc'?`<button class="btn gold" id="lc" style="margin-top:10px">📍 التقط موقعي الآن واحفظه للمورد</button><div id="lo" style="margin-top:8px;font-weight:700"></div>`:''}
<label>${mode==='loc'?'ملاحظة (اختياري)':'التفاصيل'}</label><div class="f"><textarea class="in" id="tx" placeholder="اكتب أو اضغط 🎙 بكيبورد الأيفون">${esc(d.text)}</textarea><button class="mic gold" id="mc">🎙</button></div>
${mode!=='loc'?`<label>المبلغ (ر.س) — اختياري</label><input class="in lat" id="am" inputmode="decimal" value="${esc(d.amount)}" style="direction:ltr;text-align:left">`:''}
<button class="btn gold" id="sv" style="margin-top:14px">حفظ السجل</button></div>`;wire()}
function wire(){const g=i=>$('#'+i,sh);sh.onclick=e=>{if(e.target.dataset.x||e.target===sh)sh.remove()};
 const keep=()=>{d.text=g('tx')?.value||'';if(g('am'))d.amount=g('am').value;sid=g('s').value;kind=g('k').value};
 $$('#md a',sh).forEach(a=>a.onclick=()=>{keep();mode=a.dataset.m;if(mode==='loc')kind='loc';else if(kind==='loc')kind='note';draw()});
 g('mc').onclick=function(){const i=g('tx');const base=i.value?i.value+' ':'';dictate(this,t=>i.value=base+t)};
 if(g('dc'))g('dc').onclick=function(){const i=g('tx');const base=i.value?i.value+' ':'';dictate(this,t=>i.value=base+t)};
 if(g('rc'))g('rc').onclick=function(){keep();recAudio(this,a=>{d.audio=a;draw()})};
 if(g('cm'))g('cm').onclick=async()=>{keep();const im=await pickPhoto(true);if(im){d.img=im;draw()}};

 return `<div style="position:fixed;inset:0;bottom:calc(70px + env(safe-area-inset-bottom));display:flex;flex-direction:column"><div style="padding:calc(env(safe-area-inset-top) + 8px) 14px 8px" class="hd"><span class="back" data-act="back">›</span><h2>خريطة الموردين والعملاء</h2><button class="btn gold sm" data-act="fit">عرض الكل</button></div><div style="flex:1;position:relative"><div class="map" id="mp"><div class="tiles"></div><div class="grid2"></div><div id="pins"></div><div class="zoom"><a data-z="1">+</a><a data-z="-1">−</a><a data-z="me" style="font-size:18px">⌖</a></div></div></div><div id="pc" style="padding:8px 14px 4px;min-height:${no?'58px':'8px'}">${no?`<div class="dk" style="padding:8px 12px;font-size:12px;font-weight:700">📍 ${no} بدون موقع: ${S.sups.filter(s=>s.lat==null).slice(0,4).map(s=>esc(s.name)).join('، ')} — أضف موقعهم من صفحة المورد</div>`:''}</div></div>${nav('map')}`}
function mapFit(){const el=$('#mp');if(!el)return;const w=el.clientWidth,h=el.clientHeight,pts=S.sups.filter(s=>s.lat!=null);if(!pts.length){M={z:5,cx:WX(46.7,5),cy:WY(24.7,5)};return}
 const la=pts.map(p=>p.lat),lo=pts.map(p=>p.lng);let z=16;for(;z>3;z--){const x=Math.abs(WX(Math.max(...lo),z)-WX(Math.min(...lo),z)),y=Math.abs(WY(Math.min(...la),z)-WY(Math.max(...la),z));if(x<w-110&&y<h-150)break}
 M={z,cx:(WX(Math.max(...lo),z)+WX(Math.min(...lo),z))/2,cy:(WY(Math.min(...la),z)+WY(Math.max(...la),z))/2}}
let me=null;
function mapDraw(){const el=$('#mp');if(!el)return;const w=el.clientWidth,h=el.clientHeight,{z,cx,cy}=M;const x0=cx-w/2,y0=cy-h/2,n=2**z;let t='';
 for(let tx=Math.floor(x0/256);tx<=Math.floor((x0+w)/256);tx++)for(let ty=Math.floor(y0/256);ty<=Math.floor((y0+h)/256);ty++){if(ty<0||ty>=n)continue;const wx=((tx%n)+n)%n;t+=`<img style="left:${tx*256-x0}px;top:${ty*256-y0}px" src="https://tile.openstreetmap.org/${z}/${wx}/${ty}.png" onerror="this.style.display='none'" crossorigin="anonymous">`}
 $('.tiles',el).innerHTML=t;
 let p=S.sups.filter(s=>s.lat!=null).map(s=>`<div class="pin" data-pid="${s.id}" style="left:${WX(s.lng,z)-x0}px;top:${WY(s.lat,z)-y0}px"><img src="${IM('g_pin')}"><span>${esc(s.name)}</span></div>`).join('');
 if(me)p+=`<div style="position:absolute;left:${WX(me.lng,z)-x0-9}px;top:${WY(me.lat,z)-y0-9}px;width:18px;height:18px;border-radius:50%;background:#2a7bff;border:3px solid #fff;box-shadow:0 0 0 8px rgba(42,123,255,.25)"></div>`;$('#pins').innerHTML=p}
function mapInit(){const el=$('#mp');if(!el)return;mapFit();mapDraw();let dr=null,moved=0;
 el.onpointerdown=e=>{dr={x:e.clientX,y:e.clientY};moved=0;el.setPointerCapture(e.pointerId)};
 el.onpointermove=e=>{if(!dr)return;const dx=e.clientX-dr.x,dy=e.clientY-dr.y;moved+=Math.abs(dx)+Math.abs(dy);M.cx-=dx;M.cy-=dy;dr={x:e.clientX,y:e.clientY};cancelAnimationFrame(mapInit.f);mapInit.f=requestAnimationFrame(mapDraw)};
 el.onpointerup=e=>{if(dr&&moved<8){const p=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-pid]');if(p)mapCard(p.dataset.pid)}dr=null};
 $$('[data-z]',el).forEach(a=>a.onpointerup=async e=>{e.stopPropagation();const v=a.dataset.z;if(v==='me'){try{me=await getLoc();M.z=Math.max(M.z,15);M.cx=WX(me.lng,M.z);M.cy=WY(me.lat,M.z);mapDraw()}catch(x){toast('فعّل الموقع للمتصفح')}return}const dz=+v,nz=Math.min(19,Math.max(3,M.z+dz));if(nz===M.z)return;const k=2**(nz-M.z);M.cx*=k;M.cy*=k;M.z=nz;mapDraw()})}

/* settings */
function settings(){return `<div class="scr"><div class="hd"><span class="back" data-act="back">›</span><h2>الإعدادات</h2></div><div class="dk" style="padding:14px;line-height:2"><div>المستخدم: <b class="lat">${esc(S.auth.u)}</b></div><div style="font-size:12px;color:#cfe0da">البيانات محفوظة على هذا الجهاز وتعمل بدون إنترنت. خذ نسخة احتياطية بشكل دوري.</div></div><div style="height:10px"></div><button class="btn gold" data-act="export">⬇ نسخة احتياطية (ملف)</button><div style="height:8px"></div><button class="btn o" data-act="import">⬆ استرجاع نسخة</button><div style="height:8px"></div><button class="btn r" data-act="logout">تسجيل الخروج</button><div style="text-align:center;margin-top:24px"><img src="${SIG}" style="height:50px;filter:invert(1) sepia(1) saturate(2) hue-rotate(5deg) brightness(1.3)"><div class="lat" style="font-size:9px;letter-spacing:4px;color:var(--gl)">HIDAYA · MUSHTARAYATI v1</div></div></div>${nav('home')}`}
function smart(){const al=alerts();const sh=document.createElement('div');sh.className='sheet';sh.innerHTML=`<div><div class="hd"><img src="${IM('f_ai')}" style="height:42px;border-radius:10px"><h2>المستشار الذكي</h2><span class="back" data-x="1">✕</span></div>${al.map(a=>`<div class="card tl" style="font-weight:800">${a}</div>`).join('')||'<div class="card tl">كل شيء تمام ✓</div>'}</div>`;sh.onclick=e=>{if(e.target.dataset.x||e.target===sh)sh.remove()};document.body.appendChild(sh)}
/* login */
function loginView(first){return `<div class="login"><img class="logo" src="${IM('logo')}"><h1 class="gtxt">MUSHTARAYATI</h1><p>HIDAYA · PURCHASING</p><div style="width:100%;max-width:340px"><input class="in" id="u" placeholder="Username" autocapitalize="off" autocomplete="username"><input class="in" id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="btn gold" id="go" style="margin-top:6px">${first?'Create & Start':'Sign in'}</button><div id="le" style="color:#ffb4a8;font:600 12px Montserrat;margin-top:8px;text-align:center;direction:ltr"></div></div><img src="${SIG}" style="height:58px;margin-top:26px;filter:invert(1) sepia(1) saturate(2) hue-rotate(5deg) brightness(1.3)"><div class="lat" style="font-size:9px;letter-spacing:5px;color:var(--gl);margin-top:4px">SEE · UNDERSTAND · GUIDE</div></div>`}
function showLogin(){const first=!S.auth;const d=document.createElement('div');d.innerHTML=loginView(first);const el=d.firstChild;document.body.appendChild(el);
 $('#go',el).onclick=async()=>{const u=$('#u',el).value.trim(),p=$('#pw',el).value;if(!u||p.length<4){$('#le',el).textContent='Enter username and a password (4+ chars)';return}const h=await sha(u+'|'+p);if(first){S.auth={u,h};save()}else if(S.auth.u!==u||S.auth.h!==h){$('#le',el).textContent='Wrong username or password';return}
  try{localStorage.setItem('mush_in','1')}catch(e){}el.remove();render()}}
/* render + events */
function render(){const a=$('#app');const n=V.n;a.innerHTML=({home,sups,sup:()=>supPage(V.a),map:mapPage,balances,invoices,confs,reports,settings})[n]();if(n==='map')setTimeout(mapInit,30);if(n==='sups'){const q=$('#q');q&&(q.oninput=()=>{V.q=q.value;const p=q.selectionStart;render();const nq=$('#q');nq.focus();nq.setSelectionRange(p,p)})}}
document.addEventListener('click',e=>{const t=e.target;
 if(t.closest('[data-stop]')){e.stopPropagation();if(t.closest('a')&&!t.closest('a').getAttribute('href')){e.preventDefault();toast('لا يوجد رقم/موقع محفوظ لهذا المورد')}return}
 const tyA=t.closest('[data-ty]');if(tyA){V.ty=tyA.dataset.ty;render();return}
 const el=t.closest('[data-go],[data-act]');if(!el)return;
 if(el.dataset.go){e.preventDefault();return go(el.dataset.go,el.dataset.id)}
 const ac=el.dataset.act,d=el.dataset;
 if(ac==='back')back();else if(ac==='addSup')supForm();else if(ac==='editSup')supForm(d.id);
 else if(ac==='newEntry')entry({mode:d.mode,sid:d.sid,kind:d.kind});
 else if(ac==='newConf')confSheet(d.id);else if(ac==='printConf')printConf(d.id);
 else if(ac==='smart')smart();else if(ac==='noloc'){e.preventDefault();toast('لا يوجد موقع محفوظ — افتح المورد واضغط «موقع»')}
 else if(ac==='fit'){mapFit();mapDraw()}else if(ac==='rep')report(d.k);
 else if(ac==='done'){const r=S.recs.find(x=>x.id===d.id);r.done=!r.done;save();render()}
 else if(ac==='delRec'){if(confirm('حذف هذا السجل؟')){S.recs=S.recs.filter(x=>x.id!==d.id);save();render()}}
 else if(ac==='export'){const b=new Blob([JSON.stringify(S)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='mushtarayati-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove()}
 else if(ac==='import'){const i=$('#impIn');i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.sups)throw 0;if(confirm('استبدال بيانات الجهاز بالنسخة؟')){S={...j,auth:S.auth||j.auth};save();toast('تم الاسترجاع ✓');render()}}catch(x){toast('ملف غير صالح')}};r.readAsText(f)};i.click()}
 else if(ac==='logout'){try{localStorage.removeItem('mush_in')}catch(x){}location.reload()}
});
(async()=>{const v=await load();if(v)S={sups:[],recs:[],confs:[],auth:null,...v};
 let inn=false;try{inn=localStorage.getItem('mush_in')==='1'}catch(e){}
 if(!S.auth||!inn)showLogin();render();
 if('serviceWorker' in navigator)navigator.serviceWorker.register('mush-sw.js').catch(()=>{});
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})})();
</script>
</body>
</html>
