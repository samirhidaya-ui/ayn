<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700;900&family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--g0:#03150e;--g1:#062a1c;--g2:#0b3a2d;--g3:#14563c;--gold:#d4a540;--gl:#f6e3a1;--red:#ff6b5b;--blue:#7cc4ff;--grn:#7ee0a4}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--g0);overscroll-behavior:none}
body{font-family:"Readex Pro",Tahoma,sans-serif;color:#fff;direction:rtl}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:16px}
.lat{font-family:Montserrat,sans-serif;direction:ltr;unicode-bidi:isolate}
[hidden]{display:none!important}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 40%,var(--g3) 0,var(--g1) 58%,var(--g0) 100%);overflow:hidden;transition:opacity .7s}
#intro.out{opacity:0;pointer-events:none}
#stage{position:absolute;left:50%;top:50%;width:340px;height:700px;margin:-350px 0 0 -170px;transform-origin:50% 50%;transition:transform 1s cubic-bezier(.5,0,.2,1)}
#stage>*{position:absolute;left:50%;transform:translateX(-50%)}
.i-sg{top:84px;width:190px;opacity:0;animation:iWrite 1.5s .2s forwards}
.i-tag{top:150px;font:500 10px Montserrat;letter-spacing:6px;padding-left:6px;color:#d9c48f;white-space:nowrap;opacity:0;animation:iFade .6s 1.5s forwards}
.i-ln{top:178px;height:2px;width:0;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:iLine .8s 1.7s forwards}
.i-eye{top:178px;width:98px;height:98px;filter:saturate(1.35) contrast(1.25) brightness(1.05) drop-shadow(0 0 2px rgba(0,0,0,.6)) drop-shadow(0 0 12px rgba(255,200,90,.4));opacity:0;animation:iUp .8s 2.2s forwards}
.i-ayn{top:284px;font:900 40px/1 Montserrat;letter-spacing:12px;padding-left:12px;background:linear-gradient(180deg,#fff3c4,var(--gold) 60%,#9a6d14);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;animation:iUp .8s 2.5s forwards}
.i-tool{top:362px;width:186px;height:186px;opacity:0;animation:iGear 1.1s 3.3s forwards}
.i-tool .gear{position:absolute;inset:0;width:100%;height:100%;animation:spin 9s linear infinite;filter:drop-shadow(0 0 16px rgba(212,165,64,.55))}
.i-tool .wr{position:absolute;left:18%;top:18%;width:64%;height:64%;transform:rotate(-40deg);animation:iSwing 1s 4.2s forwards;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.rd{position:absolute;inset:-34px;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 34px,rgba(126,224,164,.13) 35px 36px);overflow:hidden;opacity:0;animation:iFade .8s 4s forwards}
.rd .swp{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(126,224,164,.45),rgba(126,224,164,.12) 40deg,transparent 70deg);animation:spin 2.6s linear infinite}
.rd .pg{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px;border-radius:50%;border:2px solid rgba(126,224,164,.55);animation:ping 2.6s ease-out infinite}
.rd .p2{animation-delay:.87s}.rd .p3{animation-delay:1.73s}
.rd .bl{position:absolute;width:9px;height:9px;border-radius:50%;background:#ff5a4a;box-shadow:0 0 10px #ff5a4a;animation:blip 2.6s infinite}
.rd .b1{left:18%;top:26%}.rd .b2{right:16%;bottom:22%;animation-delay:1.3s}
.i-rad{top:588px;font:900 30px/1 Montserrat;letter-spacing:14px;padding-left:14px;background:linear-gradient(180deg,#fff3c4,var(--gold) 60%,#9a6d14);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;opacity:0;animation:iUp .8s 5s forwards}
.i-ar{top:626px;font:900 18px "Readex Pro";color:var(--gl);white-space:nowrap;opacity:0;animation:iUp .8s 5.3s forwards}
.i-ar span{font:500 11px Montserrat;letter-spacing:3px;color:#d9c48f}
#skip{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 14px);left:0;right:0;text-align:center;font-size:12px;color:rgba(246,227,161,.55)}
@keyframes iWrite{0%{opacity:1;clip-path:inset(0 100% 0 0)}100%{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes iFade{to{opacity:.95}}
@keyframes iLine{to{width:220px}}
@keyframes iUp{0%{opacity:0;transform:translate(-50%,12px) scale(.92)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes iGear{0%{opacity:0;transform:translate(-50%,0) scale(.3) rotate(-90deg)}70%{opacity:1;transform:translate(-50%,0) scale(1.08) rotate(8deg)}100%{opacity:1;transform:translate(-50%,0) scale(1) rotate(0)}}
@keyframes iSwing{0%{transform:rotate(-40deg)}50%{transform:rotate(15deg)}75%{transform:rotate(-6deg)}100%{transform:rotate(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(10);opacity:0}}
@keyframes blip{0%,100%{opacity:0}10%,40%{opacity:1}}

/* login under the intro */
#login{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 26px);transform:translateX(-50%);width:min(330px,88vw);opacity:0;pointer-events:none;transition:opacity .8s .3s}
#intro.lg #login{opacity:1;pointer-events:auto}
#login input{display:block;width:100%;margin-bottom:10px;padding:13px 14px;border-radius:14px;border:1.5px solid rgba(212,165,64,.55);background:rgba(0,0,0,.28);color:#fff;text-align:center}
#login input::placeholder{color:rgba(246,227,161,.5)}
#login button{width:100%;padding:13px;border:0;border-radius:14px;background:linear-gradient(180deg,#f3d98d,var(--gold) 55%,#a7781d);color:#1b2a22;font:900 16px Montserrat;letter-spacing:3px}
#lmsg{min-height:18px;text-align:center;font-size:13px;color:var(--gl);margin-top:8px}

/* ---------- app ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(130% 70% at 50% 0%,var(--g3) 0,var(--g2) 38%,var(--g1) 70%,var(--g0) 100%)}
.scr{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 30px)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.top img{width:38px;height:38px}
.top .bt{flex:1}
.top .bt b{display:block;font:900 20px/1 Montserrat;letter-spacing:5px;background:linear-gradient(180deg,#fff3c4,var(--gold) 60%,#9a6d14);-webkit-background-clip:text;background-clip:text;color:transparent}
.top .bt small{font:500 10px Montserrat;letter-spacing:3px;color:#cdb98a}
.who{font-size:12px;color:var(--gl);text-align:left;line-height:1.3}
.who i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--grn);margin-left:4px;box-shadow:0 0 6px var(--grn)}
.who i.off{background:#999;box-shadow:none}
.ibtn{width:38px;height:38px;border-radius:12px;border:1.5px solid rgba(212,165,64,.45);background:rgba(0,0,0,.18);color:var(--gl);font-size:18px}

/* mic */
.micw{position:relative;width:170px;height:170px;margin:12px auto 4px}
.mic{position:absolute;inset:22px;border-radius:50%;border:2.5px solid var(--gold);background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.12),rgba(0,0,0,.12));box-shadow:0 0 0 6px rgba(212,165,64,.1),0 0 26px rgba(212,165,64,.35),inset 0 0 18px rgba(212,165,64,.18);display:flex;align-items:center;justify-content:center}
.mic svg{width:54px;height:54px}
.wv{position:absolute;inset:22px;border-radius:50%;border:2px solid rgba(212,165,64,.55);opacity:0}
.micw.on .wv{animation:wave 1.8s ease-out infinite}.micw.on .w2{animation-delay:.6s}.micw.on .w3{animation-delay:1.2s}
.micw.on .mic{border-color:#ff8a7a;box-shadow:0 0 0 6px rgba(255,107,91,.15),0 0 30px rgba(255,107,91,.45)}
@keyframes wave{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.55);opacity:0}}
.bars{display:flex;gap:4px;justify-content:center;height:22px;align-items:center;margin-bottom:2px}
.bars i{width:4px;height:6px;border-radius:2px;background:var(--gold);opacity:.5}
.micw.on~.bars i{animation:bar .9s ease-in-out infinite;opacity:1}
.bars i:nth-child(2){animation-delay:.1s!important}.bars i:nth-child(3){animation-delay:.2s!important}.bars i:nth-child(4){animation-delay:.3s!important}.bars i:nth-child(5){animation-delay:.4s!important}.bars i:nth-child(6){animation-delay:.5s!important}.bars i:nth-child(7){animation-delay:.6s!important}
@keyframes bar{0%,100%{height:6px}50%{height:22px}}
.mhint{text-align:center;font-size:12.5px;color:rgba(246,227,161,.75);line-height:1.6;margin:0 10px 10px}
.alt{display:flex;gap:10px;justify-content:center;margin-bottom:12px}
.alt button{flex:0 0 auto;padding:9px 16px;border-radius:14px;border:1.5px solid rgba(212,165,64,.55);background:rgba(0,0,0,.18);color:var(--gl);font-size:14px;font-weight:700}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:4px 0 10px}
.tile{position:relative;border-radius:18px;border:1.5px solid rgba(212,165,64,.45);background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02));color:#fff;padding:12px 4px 10px;text-align:center;font-weight:700;font-size:13px;line-height:1.35}
.tile b{display:block;font-size:26px;line-height:1.2}
.tile em{position:absolute;top:-7px;left:-5px;min-width:22px;height:22px;border-radius:11px;background:var(--gold);color:#1b2a22;font:900 12px/22px Montserrat;font-style:normal;padding:0 5px}
.tile.wn em{background:var(--red);color:#fff;box-shadow:0 0 10px rgba(255,107,91,.7);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.45}}
.tools{display:flex;gap:8px;margin-bottom:12px}
.tools button{flex:1;padding:10px 4px;border-radius:14px;border:1.5px solid rgba(212,165,64,.35);background:rgba(0,0,0,.18);color:var(--gl);font-size:13px;font-weight:700}

.sec{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 8px;font-weight:900;font-size:15px;color:var(--gl)}
.sec .live{font-size:11px;font-weight:600;color:var(--grn)}
.sec .live i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--grn);margin-left:4px;animation:blink 1.2s infinite}
.ent{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin-bottom:8px;border-radius:16px;background:rgba(0,0,0,.2);border:1px solid rgba(212,165,64,.25);border-right:4px solid var(--gold);animation:slideIn .5s ease}
.ent.svc{border-right-color:var(--blue)}.ent.wn{border-right-color:var(--red)}
.ent.dup{opacity:.45}
.ent .ic{font-size:22px;line-height:1}
.ent .bd{flex:1;min-width:0;font-size:14px;line-height:1.55}
.ent .bd b{color:var(--gl)}
.ent .bd .meta{font-size:11.5px;color:rgba(255,255,255,.6)}
.ent .dg{display:inline-block;font-size:11px;background:rgba(255,255,255,.12);border-radius:8px;padding:1px 7px;margin-right:4px;color:#fff}
.ent.new{box-shadow:0 0 16px rgba(212,165,64,.45)}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.empty{text-align:center;color:rgba(255,255,255,.55);font-size:13px;padding:18px 0}

/* sheets */
.sh{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
.sh>div{width:100%;max-height:92vh;overflow-y:auto;background:linear-gradient(180deg,#0e4231,#06261b);border-top:2px solid var(--gold);border-radius:22px 22px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom) + 18px)}
.sh h3{font-size:17px;color:var(--gl);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.sh h3 button{background:none;border:0;color:var(--gl);font-size:24px;padding:0 6px}
.sh textarea,.sh input,.sh select{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid rgba(212,165,64,.45);background:rgba(0,0,0,.25);color:#fff;margin-bottom:8px}
.sh textarea{min-height:96px;line-height:1.6}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:14px;background:linear-gradient(180deg,#f3d98d,var(--gold) 55%,#a7781d);color:#1b2a22;font-weight:900;font-size:15px;margin-top:6px}
.btn.o{background:transparent;border:1.5px solid var(--gold);color:var(--gl)}
.btn.r{background:linear-gradient(180deg,#ff8a7a,#c63a2a);color:#fff}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.pc{border-radius:16px;padding:10px;margin-bottom:10px;background:rgba(0,0,0,.22);border:1.5px solid rgba(212,165,64,.35)}
.pc.wn{border-color:rgba(255,107,91,.7)}
.pc .ty{display:flex;gap:6px;margin-bottom:8px}
.pc .ty button{flex:1;padding:7px 4px;border-radius:10px;border:1.5px solid rgba(255,255,255,.2);background:transparent;color:#fff;font-size:13px}
.pc .ty button.on{background:var(--gold);color:#1b2a22;border-color:var(--gold);font-weight:900}
.pc label{font-size:12px;color:rgba(246,227,161,.8);display:block;margin:2px 2px 3px}
.pc .raw{font-size:12px;color:rgba(255,255,255,.6);margin-top:4px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--gold)}
.wact{display:flex;gap:6px;margin-top:8px}.wact button{flex:1;padding:8px 2px;border-radius:10px;border:1.5px solid rgba(212,165,64,.45);background:rgba(0,0,0,.2);color:#fff;font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{padding:7px 12px;border-radius:12px;border:1.5px solid rgba(212,165,64,.45);background:transparent;color:#fff;font-size:13px}
.chips button.on{background:var(--gold);color:#1b2a22;font-weight:900}
.chips button.lock{opacity:.75;border-style:dashed}
#rep{background:#fff;color:#1f2e2d;border-radius:12px;padding:12px;overflow-x:auto}
#rep .rh{display:flex;align-items:center;gap:10px;border-bottom:2px solid #c9a96a;padding-bottom:8px;margin-bottom:8px}
#rep .rh img{width:44px;height:44px;border-radius:10px;background:#0e3d36}
#rep .rh b{font:900 16px Montserrat;letter-spacing:3px;color:#0e3d36;display:block}
#rep .rh small{font-size:11px;color:#6b6250}
#rep table{width:100%;border-collapse:collapse;font-size:11.5px}
#rep th{background:#0e3d36;color:#f6e3a1;padding:5px 4px;font-weight:700}
#rep table{table-layout:fixed}#rep td{border-bottom:1px solid #e6dcc4;padding:5px 4px;vertical-align:top;word-break:break-word}
#rep tr.dup td{opacity:.45}
#rep .tot{margin-top:6px;font-size:11.5px;color:#4a432f}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:#0e3d36;border:1.5px solid var(--gold);color:var(--gl);padding:10px 16px;border-radius:14px;font-size:14px;z-index:99;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.busy{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.3);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
.rpx .rh{display:flex;align-items:center;gap:14px;border-bottom:3px solid #c9a96a;padding-bottom:10px;margin-bottom:12px}.rpx .rh img{width:58px!important;height:58px!important}.rpx .rh b{font:900 24px Montserrat,sans-serif;letter-spacing:6px;color:#0e3d36;display:block}.rpx .rh small{font-size:14px;color:#6b6250}
.rpx table{width:100%;border-collapse:collapse;font-size:14px}.rpx th{background:#0e3d36;color:#f6e3a1;padding:8px 6px;font-weight:700}.rpx td{border-bottom:1px solid #e6dcc4;padding:8px 6px;vertical-align:top}.rpx tr:nth-child(even) td{background:#faf6ec}.rpx tr.dup td{opacity:.4}.rpx .tot{margin-top:10px;font-size:14px;color:#4a432f}

@media print{body *{visibility:hidden}#rep,#rep *{visibility:visible}#rep{position:absolute;left:0;top:0;width:100%}}
</style>
</head>

/* ---------- local store (IndexedDB) ---------- */
let DB;function idb(){if(DB)return Promise.resolve(DB);return new Promise((res,rej)=>{const r=indexedDB.open('radar-db',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('items',{keyPath:'id'});d.createObjectStore('q',{keyPath:'id'});d.createObjectStore('meta',{keyPath:'k'})};r.onsuccess=()=>{DB=r.result;res(DB)};r.onerror=()=>rej(r.error)})}

const iAll=()=>tx('items','readonly',t=>t.objectStore('items').getAll());

const qGet=id=>tx('q','readonly',t=>t.objectStore('q').get(id));

let items=[];
const st={logged:false,owner:false,uid:'',name:'',user:'',prof:null,pend:new Set(),last:0,err:null};

/* ---------- auth / rest ---------- */
const sGet=()=>J(LS('radar-sess'));const sSet=s=>LS('radar-sess',s?JSON.stringify(s):null);
let rP=null;
function refresh(){if(rP)return rP;rP=(async()=>{const s=sGet();if(!s||!s.refresh)throw{code:'nosess'};let r;try{r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'content-type':'application/json'},body:JSON.stringify({refresh_token:s.refresh})})}catch(_){throw{code:'net'}}
 if(!r.ok){if(r.status>=400&&r.status<500)throw{code:'invalid'};throw{code:'net'}}const j=await r.json();const n=Object.assign({},s,{access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000});sSet(n);return n})();const c=()=>{rP=null};rP.then(c,c);return rP}

 try{r=await fetch(SB+'/rest/v1/'+path,{method,headers:Object.assign({apikey:KEY,Authorization:'Bearer '+t,'content-type':'application/json'},o.h||{}),body:o.body===undefined?undefined:JSON.stringify(o.body)})}catch(_){throw{code:'net'}}
 if(r.status===401&&a===0){await refresh();continue}
 if(!r.ok){let b=null;try{b=await r.json()}catch(_){}throw{code:'http',status:r.status,body:b}}
 if(r.status===204)return null;const x=await r.text();return x?JSON.parse(x):null}}

/* ---------- sync ---------- */
let busyF=false,busyP=false;
const toRow=o=>o.op==='del'?{id:o.id,kind:o.kind,data:{},deleted:true}:{id:o.id,kind:o.kind,data:o.item,deleted:false};

 try{const q=(await qAll()).sort((a,b)=>a.ts-b.ts);
  for(const o of q){try{await rest('POST','items?on_conflict=id',{h:{Prefer:'resolution=merge-duplicates,return=minimal'},body:[toRow(o)]});const c=await qGet(o.id);if(c&&c.ts===o.ts)await qDel(o.id)}

  await qSync();st.last=Date.now();st.err=null}catch(e){netErr(e)}finally{busyF=false;who()}}
async function applyRow(r){if(st.pend.has(r.id))return false;const i=items.findIndex(x=>x.id===r.id);

 if(i>=0){if(JSON.stringify(items[i])===JSON.stringify(it))return false;items[i]=it}else items.push(it);await iPut(it);return true}
async function pull(){if(busyP||!st.logged||!navigator.onLine)return;busyP=true;let ch=false;
 try{const wm=await mGet('wm');let newest=wm||'',off=0;

function partsOf(c){const out=[];let s=' '+norm(c)+' ';
 const re=/(?:^|\s)و?(\d+(?:\.\d+)?|واحد|واحده|اتنين|اثنين|تنين|جوز|تلاته|ثلاثه|تلات|ثلاث|اربعه|اربع|خمسه|خمس|سته|ست|سبعه|سبع|تمانيه|ثمانيه|تمن|تسعه|تسع|عشره|عشر|نص|ربع)\s+(.+?)(?=\s(?:و\s?)?(?:\d+(?:\.\d+)?|واحد|اتنين|اثنين|تلاته|ثلاثه|اربعه|خمسه|سته|سبعه|تمانيه|ثمانيه|تسعه|عشره|نص|ربع)\s|\s(?:و)?(?:لحام|بنشر|ترصيص|غسيل|تشحيم|فحص|ضبط|ظبط|صلحنا|اصلاح|تصليح|خراطه|سمكره)|\sو(?:عملنا|غيرنا|ركبنا)|$)/g;

  const w=rest.split(' ');if(UNITS.includes(w[0])){u=w.shift();rest=w.join(' ');if(/^كفر/.test(u)){rest=('كفر '+rest).trim();u=''}}

 if(aiKey()&&navigator.onLine){toast('بتعرّف على القطعة…',5000);try{const j=await aiPhoto(f);if(j&&j.name){cap.text=(cap.text?cap.text+'، ':'')+'1 '+j.name+(j.hint?' ('+j.hint+')':'');toast((j.sure?'✅ ':'🤔 ')+j.name)}}catch(_){toast('ما قدرتش أتعرّف عليها، اكتب اسمها')}}
 openCapture()};

/* ---------- pages ---------- */
const TYN={out:['📦','صرف المستودع'],svc:['🔧','صيانة بدون صرف'],wn:['📝','WN — محتاج توضيح']};
function entHTML(o,dm,isNew){const t=TYN[o.type]||TYN.wn;const dup=dm[o.id];const d=o.driver||driverOf(o.plate);
 return '<div class="ent '+o.type+(dup?' dup':'')+(isNew?' new':'')+'" data-id="'+o.id+'"><div class="ic">'+t[0]+'</div><div class="bd">'+
  (o.plate?'<b>'+E(o.plate)+'</b>':'<b style="color:#ffb3a8">بدون رقم</b>')+(d?' <span class="dg">'+E(d)+'</span>':'')+(dup?' <span class="dg">🔁 مكررة</span>':'')+'<br>'+
  E([itemsTxt(o),workTxt(o)].filter(Boolean).join(' · ')||o.text)+(o.type==='wn'&&o.why?'<br><span style="color:#ffb3a8;font-size:12px">⚠ '+E(o.why)+'</span>':'')+
  '<div class="meta">'+hm(o.ts)+' · '+E(o.user||'')+(o.snooze&&o.snooze>Date.now()?' · ⏸ مؤجلة':'')+(st.pend.has(o.id)?' · ⏳ لسه ما اترفعش':'')+'</div></div></div>'}
function openPage(p){const dm=dupMap();
 const list=ops().filter(o=>o.type===p&&(p!=='wn'||o.st==='open')).sort((a,b)=>b.ts-a.ts);
 let h='<h3>'+TYN[p][0]+' '+TYN[p][1]+' <button onclick="rClose()">×</button></h3>';
 if(p==='wn')h+='<div class="raw" style="margin-bottom:8px">هنا أي حاجة مش واضحة. وضّحها واعتمدها، أو أجّلها.</div>';
 if(!list.length)h+='<div class="empty">مفيش حاجة هنا</div>';
 let lastD='';list.forEach(o=>{const d=dt(o.ts);if(d!==lastD){h+='<div class="sec" style="font-size:13px">'+(isToday(o.ts)?'النهارده':d)+'</div>';lastD=d}
  h+=entHTML(o,dm);if(p==='wn')h+='<div class="wact" data-w="'+o.id+'"><button data-a="ok">✅ وضّح واعتمد</button><button data-a="later">⏸ أجّل</button>'+(perm('edit')?'<button data-a="del">🗑 حذف</button>':'')+'</div>'});
 h+='<button class="btn" id="padd">➕ تسجيل جديد</button>';sheet(h);
 $('padd').onclick=openCapture;
 $('shb').querySelectorAll('.wact button').forEach(b=>b.onclick=()=>wnAct(b.closest('.wact').dataset.w,b.dataset.a));
 $('shb').querySelectorAll('.ent').forEach(el=>el.onclick=()=>{if(p!=='wn')openEnt(el.dataset.id)})}
document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>openPage(b.dataset.p));
async function wnAct(id,a){const o=items.find(x=>x.id===id);if(!o)return;
 if(a==='later'){o.snooze=Date.now()+86400e3;o.hist=(o.hist||[]).concat([{a:'later',by:st.name,ts:Date.now()}]);await put(o);toast('⏸ اتأجلت لبكرة');openPage('wn');return}
 if(a==='del'){if(!confirm('تحذف دي؟'))return;o.st='x';o.hist=(o.hist||[]).concat([{a:'del',by:st.name,ts:Date.now()}]);await put(o);openPage('wn');return}
 if(a==='ok'){RV={text:o.raw||o.text,list:[{type:(o.items||[]).length?'out':'svc',plate:o.plate,items:o.items||[],work:o.work||[],text:o.text,photos:o.photos}],src:o};
  sheet('<h3>وضّح واعتمد <button onclick="rClose()">×</button></h3><div class="raw" style="margin-bottom:8px">«'+E(o.text)+'»</div><div id="rvl">'+pcard(RV.list[0],0,false)+'</div><button class="btn" id="rok">✅ اعتمد</button>');
  const c=$('rvl').querySelector('.pc');c.querySelectorAll('.ty button').forEach(b=>b.onclick=()=>{c.querySelectorAll('.ty button').forEach(x=>x.classList.toggle('on',x===b));RV.list[0].type=b.dataset.t});c.querySelector('[data-del]').hidden=true;
  $('rok').onclick=async()=>{grab();const e=RV.list[0];if(e.type==='wn'||!e.plate||(!e.items.length&&!e.work.length)){toast('محتاج رقم العربية والقطع أو الشغل');return}
   Object.assign(o,{type:e.items.length&&e.type==='out'?'out':'svc',plate:e.plate,driver:driverOf(e.plate),items:e.items,work:e.work,st:'ok',okBy:st.name,okTs:Date.now()});o.hist=(o.hist||[]).concat([{a:'ok',by:st.name,ts:Date.now()}]);await put(o);toast('✅ اتعتمدت');openPage('wn')}}}
function openEnt(id){const o=items.find(x=>x.id===id);if(!o)return;const dm=dupMap();
 let h='<h3>'+TYN[o.type][0]+' '+E(o.plate)+' <button onclick="rClose()">×</button></h3>'+entHTML(o,dm)+'<div class="raw">اللي اتقال: «'+E(o.raw||o.text)+'»</div>'+(o.photos&&o.photos.length?'<div class="thumbs" style="margin-top:8px">'+o.photos.map(p=>'<img src="'+p+'">').join('')+'</div>':'');
 if(dm[o.id])h+='<div class="raw" style="color:#ffd27a">🔁 شبه تسجيل تاني لنفس العربية خلال يوم ونص — مش هتتحسب مرتين.</div>';
 if(perm('edit'))h+='<button class="btn o" id="eed">✏️ تعديل</button>';else h+='<div class="raw" style="margin-top:10px">🔒 التعديل مقفول — كلّم سمير لو فيه غلط، أو سجّل تصحيح جديد.</div>';
 sheet(h);if($('eed'))$('eed').onclick=()=>{RV={text:o.raw,list:[Object.assign({},o)]};sheet('<h3>تعديل <button onclick="rClose()">×</button></h3><div id="rvl">'+pcard(RV.list[0],0,false)+'</div><button class="btn" id="esv">حفظ</button>');
  const c=$('rvl').querySelector('.pc');c.querySelector('[data-del]').hidden=true;c.querySelectorAll('.ty button').forEach(b=>b.onclick=()=>{c.querySelectorAll('.ty button').forEach(x=>x.classList.toggle('on',x===b));RV.list[0].type=b.dataset.t});
  $('esv').onclick=async()=>{grab();const e=RV.list[0];Object.assign(o,{type:e.type,plate:e.plate,driver:driverOf(e.plate),items:e.items,work:e.work,st:e.type==='wn'?'open':'ok'});o.hist=(o.hist||[]).concat([{a:'edit',by:st.name,ts:Date.now()}]);await put(o);closeSheet();toast('✅ اتعدلت')}}}

/* ---------- report / preview / PDF / WhatsApp ---------- */
const COLS=[['date','التاريخ',1],['plate','العربية',1],['driver','السائق',1],['type','النوع'],['items','القطع والكمية'],['work','الشغل'],['user','سجّلها'],['note','ملاحظة']];
let RP={range:'today',cols:J(LS('radar-cols'))||{type:1,items:1,work:1,user:0,note:0}};
function rangeOf(r){const d=new Date();d.setHours(0,0,0,0);const t0=d.getTime();if(r==='today')return[t0,Infinity];if(r==='yest')return[t0-864e5,t0];if(r==='week')return[t0-6*864e5,Infinity];return[t0-29*864e5,Infinity]}
function repHTML(){const[a,b]=rangeOf(RP.range);const dm=dupMap();const L=ops().filter(o=>o.type!=='wn'&&o.ts>=a&&o.ts<b).sort((x,y)=>x.ts-y.ts);
 const cs=COLS.filter(c=>c[2]||RP.cols[c[0]]);const lbl={today:'اليوم',yest:'أمس',week:'آخر ٧ أيام',month:'آخر ٣٠ يوم'}[RP.range];
 const cell=(o,k)=>k==='date'?dt(o.ts)+' '+hm(o.ts):k==='plate'?o.plate:k==='driver'?(o.driver||driverOf(o.plate)):k==='type'?(o.type==='out'?'صرف':'صيانة'):k==='items'?itemsTxt(o):k==='work'?workTxt(o):k==='user'?o.user:k==='note'?(dm[o.id]?'🔁 مكررة':''):'';
 const nOut=L.filter(o=>o.type==='out'&&!dm[o.id]).length,nSvc=L.filter(o=>o.type==='svc'&&!dm[o.id]).length,nV=new Set(L.map(o=>digits(o.plate))).size;
 return '<div class="rh"><img src="'+document.querySelector('.top img').src+'"><div><b>RADAR</b><small>تشغيل الورشة والمستودع · '+lbl+' · '+new Date().toLocaleDateString('ar-EG')+'</small></div></div>'+
  '<table><thead><tr>'+cs.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr></thead><tbody>'+(L.length?L.map(o=>'<tr'+(dm[o.id]?' class="dup"':'')+'>'+cs.map(c=>'<td>'+E(cell(o,c[0]))+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+cs.length+'" style="text-align:center;padding:14px">مفيش تسجيلات في الفترة دي</td></tr>')+'</tbody></table>'+
  '<div class="tot">عربيات: <b>'+nV+'</b> · صرف: <b>'+nOut+'</b> · صيانة بدون صرف: <b>'+nSvc+'</b>'+(Object.keys(dm).length?' · المكرر مش محسوب':'')+'</div>'}
function openReport(){if(!perm('preview')){toast('🔒 المعاينة محتاجة إذن من سمير');return}
 const draw=()=>{sheet('<h3>👁 معاينة التقرير <button onclick="rClose()">×</button></h3><div class="chips" id="rr">'+[['today','اليوم'],['yest','أمس'],['week','الأسبوع'],['month','الشهر']].map(r=>'<button data-r="'+r[0]+'" class="'+(RP.range===r[0]?'on':'')+'">'+r[1]+'</button>').join('')+'</div>'+
  (perm('cols')?'<div class="chips" id="rc">'+COLS.map(c=>'<button data-c="'+c[0]+'" class="'+(c[2]?'on lock':(RP.cols[c[0]]?'on':''))+'">'+(c[2]?'🔒 ':'')+c[1]+'</button>').join('')+'</div>':'')+
  '<div id="rep">'+repHTML()+'</div><div class="row2">'+(perm('pdf')?'<button class="btn" id="rpdf">📄 PDF</button>':'')+(perm('wa')?'<button class="btn" id="rwa" style="background:linear-gradient(180deg,#5fe08a,#1f9d4c);color:#fff">💬 واتساب</button>':'')+'</div>'+(perm('pdf')?'<button class="btn o" id="rpr">🖨 طباعة</button>':''));
  $('rr').querySelectorAll('button').forEach(b=>b.onclick=()=>{RP.range=b.dataset.r;draw()});
  if($('rc'))$('rc').querySelectorAll('button').forEach(b=>b.onclick=()=>{const c=COLS.find(x=>x[0]===b.dataset.c);if(c[2]){toast('التاريخ والعربية والسائق لازم يظهروا');return}RP.cols[c[0]]=RP.cols[c[0]]?0:1;LS('radar-cols',JSON.stringify(RP.cols));draw()});
  if($('rpdf'))$('rpdf').onclick=()=>makePDF(false);if($('rwa'))$('rwa').onclick=()=>makePDF(true);if($('rpr'))$('rpr').onclick=()=>print()};draw()}
function loadLib(src){return new Promise((res,rej)=>{if(document.querySelector('script[src="'+src+'"]')){setTimeout(res,50);return}const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function makePDF(wa){toast('بجهّز الملف…',6000);
 try{if(!window.html2canvas)await loadLib('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');if(!window.jspdf)await loadLib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')}catch(_){toast('محتاج إنترنت لعمل PDF — استخدم طباعة');return}
 const el=document.createElement('div');el.className='rpx';el.innerHTML=repHTML();el.style.cssText='position:fixed;left:-3000px;top:0;width:1060px;background:#fff;color:#1f2e2d;padding:26px 30px;direction:rtl';document.body.appendChild(el);
 let cv;try{cv=await html2canvas(el,{scale:2,backgroundColor:'#ffffff'})}finally{el.remove()}
 const pdf=new jspdf.jsPDF({unit:'mm',format:'a4',orientation:'landscape'});let W=287,H=cv.height*W/cv.width;if(H>200){W=W*200/H;H=200}pdf.addImage(cv.toDataURL('image/jpeg',.92),'JPEG',(297-W)/2,5,W,H);
 const name='RADAR - تقرير الورشة - '+new Date().toISOString().slice(0,10)+'.pdf';const blob=pdf.output('blob');const file=new File([blob],name,{type:'application/pdf'});
 window.__radarLastPDF=blob;
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return}catch(_){return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();if(wa)toast('نزل الملف — ابعته من واتساب')}

/* ---------- home render ---------- */
let seen=new Set(),first=true;
function render(){if(!st.logged)return;const dm=dupMap();const all=ops();
 const td=all.filter(o=>isToday(o.ts)&&o.type!=='wn').sort((a,b)=>b.ts-a.ts);
 const wnOpen=all.filter(o=>o.type==='wn'&&o.st==='open');
 $('c-out').textContent=all.filter(o=>o.type==='out'&&isToday(o.ts)).length;$('c-svc').textContent=all.filter(o=>o.type==='svc'&&isToday(o.ts)).length;
 $('c-wn').textContent=wnOpen.length;$('c-wn').hidden=!wnOpen.length;
 const tdAll=td.concat(wnOpen.filter(o=>isToday(o.ts))).sort((a,b)=>b.ts-a.ts);
 $('today').innerHTML=tdAll.length?tdAll.map(o=>entHTML(o,dm,!first&&!seen.has(o.id))).join(''):'<div class="empty">لسه مفيش تسجيلات النهارده — اضغط المايك وابدأ</div>';
 tdAll.forEach(o=>seen.add(o.id));first=false;
 $('today').querySelectorAll('.ent').forEach(el=>el.onclick=()=>{const o=items.find(x=>x.id===el.dataset.id);if(o&&o.type==='wn')openPage('wn');else openEnt(el.dataset.id)});
 const tl=[];if(perm('preview'))tl.push('<button id="tpv">👁 معاينة</button>');if(perm('pdf'))tl.push('<button id="tpd">📄 PDF</button>');if(perm('wa'))tl.push('<button id="twa">💬 واتساب</button>');
 $('tools').innerHTML=tl.join('');$('tools').hidden=!tl.length;
 if($('tpv'))$('tpv').onclick=openReport;if($('tpd'))$('tpd').onclick=()=>{openReport();setTimeout(()=>makePDF(false),300)};if($('twa'))$('twa').onclick=()=>{openReport();setTimeout(()=>makePDF(true),300)};
 who()}
window.__radarRender=render;
function who(){const w=$('who');if(!w)return;const on=navigator.onLine&&!st.err;w.innerHTML='<i class="'+(on?'':'off')+'"></i>'+E(st.name||st.user)+'<br><small style="color:rgba(255,255,255,.55)">'+(st.pend.size?'⏳ '+st.pend.size+' مستني نت':(on?'متصل':'بدون نت — شغال عادي'))+'</small>'}
setInterval(()=>{if(st.logged&&$('sh').hidden)render()},30000);
$('bmenu').onclick=()=>{sheet('<h3>القائمة <button onclick="rClose()">×</button></h3><div class="raw" style="margin-bottom:10px">'+E(st.name)+' · '+E(st.user)+'</div><button class="btn o" id="msy">🔄 مزامنة الآن</button>'+(perm('preview')?'<button class="btn o" id="mrp">👁 التقارير</button>':'')+'<button class="btn r" id="mlo">خروج</button>');
 $('msy').onclick=async()=>{toast('بزامن…');await flush();await pull();render();toast('✅ تمام')};if($('mrp'))$('mrp').onclick=openReport;
 $('mlo').onclick=async()=>{await qSync();if(st.pend.size&&!confirm('فيه '+st.pend.size+' تسجيل لسه ما اترفعش. هيفضلوا على الجهاز. تخرج؟'))return;sSet(null);st.logged=false;closeSheet();$('app').hidden=true;$('intro').classList.remove('out');showLogin('')}};

/* ---------- login & boot ---------- */
function mapUser(u){u=u.trim();const n=norm(u).replace(/\s+/g,' ');for(const k in ALIAS)if(norm(k)===n)return ALIAS[k];return u.toLowerCase().replace(/\s+/g,'.')}
function showLogin(m){$('intro').classList.add('lg');$('stage').style.transform='translateY(-'+Math.round(innerHeight*.17)+'px) scale('+fit(.78)+')';$('lmsg').textContent=m||'';$('skip').textContent='';if(LS('radar-lastu'))$('lu').value=LS('radar-lastu')}
function fit(k){return Math.min(1,(innerHeight*(k||1))/720,(innerWidth)/360)}
async function doLogin(){const raw=$('lu').value,p=$('lp').value;if(!raw||!p){$('lmsg').textContent='اكتب الاسم وكلمة السر';return}
 const u=mapUser(raw);const email=u.indexOf('@')>0?u:u+DOM;$('lgo').disabled=true;$('lmsg').textContent='بدخّلك…';
 try{let r;try{r=await fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'content-type':'application/json'},body:JSON.stringify({email,password:p})})}catch(_){throw{m:'مفيش إنترنت — أول دخول محتاج نت'}}
  if(!r.ok)throw{m:(r.status===400||r.status===401||r.status===422)?'الاسم أو كلمة السر غلط':'مش قادر أدخل دلوقتي، جرّب كمان شوية'};
  const j=await r.json();const s={access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,uid:j.user&&j.user.id,user:u};sSet(s);
  let prof;try{const pr=await rest('GET','profiles?select=*&id=eq.'+s.uid);prof=pr&&pr[0]}catch(_){sSet(null);throw{m:'مش قادر أحمّل الحساب، جرّب تاني'}}
  if(!prof){sSet(null);throw{m:'الحساب ناقص — كلّم سمير'}}if(!prof.active){sSet(null);throw{m:'الحساب موقوف — كلّم سمير'}}
  const last=await mGet('uid');if(last&&last!==s.uid){if(await qSync()){sSet(null);throw{m:'فيه تسجيلات لمستخدم تاني لسه ما اترفعتش'}}items=[];await iClear();await mDel('wm')}
  await mSet('uid',s.uid);await mSet('prof',prof);LS('radar-lastu',raw.trim());$('lp').value='';
  await enter(s,prof)}catch(e){$('lmsg').textContent=(e&&e.m)||'مش قادر أدخل'}$('lgo').disabled=false}
$('lgo').onclick=doLogin;
async function enter(s,prof){st.logged=true;st.uid=s.uid;st.user=s.user||'';st.prof=prof;st.owner=!!(prof&&prof.is_owner);st.name=(prof&&prof.name)||st.user;
 $('intro').classList.add('out');$('app').hidden=false;setTimeout(()=>{$('intro').classList.remove('lg')},900);render();await qSync();await flush();await pull();render()}
async function boot(){const sc=fit();$('stage').style.transform='scale('+sc+')';
 try{items=await iAll()}catch(_){items=[]}
 const s=sGet();
 if(!s){setTimeout(()=>showLogin(''),6400);$('intro').onclick=e=>{if(e.target.closest('#login'))return;showLogin('')};return}
 const prof=await mGet('prof');$('skip').textContent='اضغط للدخول';
 let done=false;const go=()=>{if(done)return;done=true;enter(s,prof||{name:s.user})};
 $('intro').onclick=go;setTimeout(go,9500)}
window.__radar={st,items:()=>items,put,render,localParse,enter};
boot();
})();
</script>
